plugins {
    id 'base'
}

ext {
    i2pVendorDir = rootProject.file('vendor/i2p.i2p')
    i2pOutDir = rootProject.file('libs/i2p')
}

tasks.register('buildI2PJars') {
    description 'Run i2p.i2p pkg via vendor gradlew'
    doLast {
        exec {
            workingDir = i2pVendorDir
            commandLine 'bash', './gradlew', 'pkg'
            standardOutput = new ByteArrayOutputStream()
            errorOutput = standardOutput
        }
    }
}

tasks.register('copyI2PJars') {
    description 'Copy i2p.i2p JARs to app/libs/i2p + write SHA256SUMS'
    dependsOn 'buildI2PJars'
    doLast {
        i2pOutDir.mkdirs()

        // Exakte Pfade (Stand i2p.i2p HEAD; anpassbar via Property wenn sich Layout ändert)
        def jars = [
            'core/build/core.jar':              'core-2.13.0.jar',
            'router/java/build/router.jar':    'router-2.13.0.jar',
            'apps/ministreaming/build/mstreaming.jar': 'ministreaming-2.13.0.jar',
        ]

        // Strikte Scope: GARANTIERT keine i2ptunnel/sam/jetty-Klassen im Output
        jars.each { srcRel, dstName ->
            def src = new File(i2pVendorDir, srcRel)
            if (!src.exists()) {
                throw new GradleException("Expected i2p.i2p build artifact: ${srcRel}. " +
                    "Run ./build.sh pkg in vendor/i2p.i2p first.")
            }
            src.withInputStream { input ->
                new File(i2pOutDir, dstName).withOutputStream { output ->
                    output << input
                }
            }
        }

        // SHA-256-Sums
        def shaOut = new StringBuilder()
        i2pOutDir.listFiles({ f -> f.name.endsWith('.jar') } as FileFilter)
            .sort { it.name }
            .each { f ->
                def md = java.security.MessageDigest.getInstance('SHA-256')
                md.update(f.bytes)
                shaOut << md.digest().collect { String.format('%02x', it) }.join('') << '  ' << f.name << '\n'
            }
        new File(i2pOutDir, 'SHA256SUMS.txt').text = shaOut.toString()

        // Sanity: keine i2ptunnel/sam/jetty/routerconsole-Klassen in den 3 JARs
        jars.each { srcRel, dstName ->
            def jar = new File(i2pOutDir, dstName)
            def entries = []
            java.util.jar.JarFile.newInstance(jar).entries().each { e ->
                if (!e.isDirectory()) entries << e.name
            }
            ['i2ptunnel', 'sam/', 'jetty', 'routerconsole'].each { banned ->
                def hit = entries.find { it.contains("${banned}/") }
                if (hit != null) {
                    throw new GradleException("License-scope violation: ${dstName} contains ${hit}")
                }
            }
        }
    }
}
