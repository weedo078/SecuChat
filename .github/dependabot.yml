# Dependabot configuration for SecuChat
# Automatically checks for dependency updates

version: 2
updates:
  # Enable version updates for npm (app directory)
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "weedo078"
    labels:
      - "dependencies"
      - "app"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for npm (electron directory)
  - package-ecosystem: "npm"
    directory: "/electron"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "weedo078"
    labels:
      - "dependencies"
      - "electron"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for npm (sam-proxy directory)
  - package-ecosystem: "npm"
    directory: "/sam-proxy"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    reviewers:
      - "weedo078"
    labels:
      - "dependencies"
      - "sam-proxy"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "weedo078"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
