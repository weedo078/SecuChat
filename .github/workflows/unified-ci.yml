name: Unified CI/CD (Electron + Android + Release)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.7)'
        required: false

env:
  # Kimi API configuration - can be overridden via repository variables
  # I2PD_VERSION removed in commit <sha>: i2pd-bundled resources are obsolete
  # post-I2CP migration (Java I2P replaces i2pd on Linux + Windows via the
  # install scripts .github/scripts/setup-i2p.{sh,ps1}).
  KIMI_API_URL: ${{ vars.KIMI_API_URL || 'https://api.kimi.com/coding/' }}
  KIMI_MODEL: ${{ vars.KIMI_MODEL || 'kimi-for-coding' }}
  KIMI_MAX_TOKENS: ${{ vars.KIMI_MAX_TOKENS || '4000' }}
  # Diff processing limits - prevents API payload size issues and keeps reviews focused
  # 100 lines: preview shown in logs for debugging
  # 300 lines: maximum diff content sent to API (keeps reviews focused on most relevant changes)
  DIFF_PREVIEW_LINES: 100
  DIFF_MAX_LINES: 300

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # DETECT CHANGES
  # ═══════════════════════════════════════════════════════════════
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      electron: ${{ steps.filter.outputs.electron }}
      android: ${{ steps.filter.outputs.android }}
      app-core: ${{ steps.filter.outputs.app-core }}
      shared: ${{ steps.filter.outputs.shared }}
      wiki: ${{ steps.filter.outputs.wiki }}
      version-file: ${{ steps.filter.outputs.version-file }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            electron:
              - 'electron/**'
              - '.github/workflows/**'
            android:
              - 'android/**'
              - 'capacitor.config.*'
              - '.github/workflows/**'
            app-core:
              - 'app/src/**'
              - 'app/public/**'
              - 'app/__tests__/**'
              - 'app/*.html'
            shared:
              - 'app/package*.json'
              - 'app/tsconfig.json'
              - 'app/vite.config.ts'
            wiki:
              - 'wiki/**'
            version-file:
              - 'app/package.json'
              - 'electron/package.json'

  # ═══════════════════════════════════════════════════════════════
  # TEST & LINT (Always for PRs and main pushes)
  # ═══════════════════════════════════════════════════════════════
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'pull_request' ||
      needs.detect-changes.outputs.electron == 'true' ||
      needs.detect-changes.outputs.android == 'true' ||
      needs.detect-changes.outputs.app-core == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Lint
        working-directory: ./app
        run: npm run lint

      - name: Type Check
        working-directory: ./app
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./app
        run: npm run build

  # ═══════════════════════════════════════════════════════════════
  # SECURITY CHECKS
  # ═══════════════════════════════════════════════════════════════
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: GitGuardian Scan
        uses: GitGuardian/ggshield-action@v1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Audit App
        working-directory: ./app
        run: npm audit --audit-level=high || true

      - name: Audit Electron
        working-directory: ./electron
        run: npm audit --audit-level=high || true
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # PR WINDOWS BUILD (Non-draft PRs only)
  # ═══════════════════════════════════════════════════════════════
  build-windows-pr:
    name: Build Windows (PR)
    runs-on: windows-latest
    needs: [detect-changes, test]
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (needs.detect-changes.outputs.electron == 'true' ||
       needs.detect-changes.outputs.app-core == 'true' ||
       needs.detect-changes.outputs.shared == 'true')
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Update version for PR build
        shell: bash
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          BETA_NUM=${{ github.run_number }}
          # SemVer format for Electron: 1.0.0-PR107-beta.44
          NEW_VERSION="1.0.0-PR${PR_NUM}-beta.${BETA_NUM}"
          echo "Setting version to: $NEW_VERSION"
          # Update package.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app/package.json','utf8')); p.version='$NEW_VERSION'; fs.writeFileSync('app/package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          PR_NUM=${{ github.event.pull_request.number }}
          BETA_NUM=${{ github.run_number }}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pr_num=${PR_NUM}" >> $GITHUB_OUTPUT
          echo "beta_num=${BETA_NUM}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Update package.json version
        shell: pwsh
        run: |
          $packageJson = Get-Content electron/package.json | ConvertFrom-Json
          $packageJson.version = "${{ steps.version.outputs.version }}"
          $packageJson | ConvertTo-Json -Depth 10 | Set-Content electron/package.json

      - name: Build app
        working-directory: ./app
        run: npm ci && npm run build

      - name: Install electron deps
        working-directory: ./electron
        run: npm ci

      - name: Build Electron (Windows)
        working-directory: ./electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Rename artifact with PR number
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $prNum = "${{ steps.version.outputs.pr_num }}"
          $betaNum = "${{ steps.version.outputs.beta_num }}"
          $files = Get-ChildItem electron/release/*.exe
          foreach ($file in $files) {
            $newName = $file.Name -replace "\.${version}\.", ".PR${prNum}.${version}-beta${betaNum}."
            Rename-Item $file.FullName -NewName $newName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-pr-build
          path: electron/release/*.exe
          retention-days: 7

      - name: Comment PR
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🪟 **Windows Build fertig!**\n\n[⬇️ Hier herunterladen](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n> ⚠️ Dies ist ein PR-Build für Testzwecke.`
            })

  # ═══════════════════════════════════════════════════════════════
  # ANDROID BUILD
  # ═══════════════════════════════════════════════════════════════
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [detect-changes, test]
    if: |
      needs.detect-changes.outputs.android == 'true' ||
      needs.detect-changes.outputs.app-core == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Check if Android directory exists
        id: check-android
        run: |
          if [ -d "app/android" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Android directory not found, skipping Android build"
          fi

      - name: Update version for PR build
        if: steps.check-android.outputs.exists == 'true' && github.event_name == 'pull_request'
        working-directory: ./app
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          BETA_NUM=${{ github.run_number }}
          # SemVer format: 1.0.0-PR107-beta.44
          NEW_VERSION="1.0.0-PR${PR_NUM}-beta.${BETA_NUM}"
          echo "Setting version to: $NEW_VERSION"
          # Update package.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='$NEW_VERSION'; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          # Update Android versionCode und versionName
          cd android/app
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NEW_VERSION\"/" build.gradle
          # versionCode muss auch erhöht werden (Android braucht Integer)
          # Nutze run_number als versionCode (eindeutig steigend)
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" build.gradle

      - uses: actions/setup-node@v4
        if: steps.check-android.outputs.exists == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        if: steps.check-android.outputs.exists == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: steps.check-android.outputs.exists == 'true'
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        if: steps.check-android.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure Gradle
        if: steps.check-android.outputs.exists == 'true'
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.daemon=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

      - name: Install Capacitor dependencies
        if: steps.check-android.outputs.exists == 'true'
        working-directory: ./app
        run: npm ci

      - name: Build Web App
        if: steps.check-android.outputs.exists == 'true'
        working-directory: ./app
        run: npm run build:android || npm run build

      - name: Sync Capacitor
        if: steps.check-android.outputs.exists == 'true'
        working-directory: ./app
        run: npx cap sync android

      - name: Make gradlew executable
        if: steps.check-android.outputs.exists == 'true'
        working-directory: ./app/android
        run: chmod +x gradlew

      - name: Build Debug APK
        if: steps.check-android.outputs.exists == 'true'
        working-directory: ./app/android
        run: ./gradlew assembleDebug --build-cache --configure-on-demand

      - name: Validate APK
        if: steps.check-android.outputs.exists == 'true'
        run: |
          APK_SIZE=$(stat -c%s "app/android/app/build/outputs/apk/debug/app-debug.apk")
          echo "APK Size: $APK_SIZE bytes"
          if [ $APK_SIZE -lt 1000000 ]; then
            echo "❌ APK seems too small!"
            exit 1
          fi

      - name: Upload APK
        if: steps.check-android.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # PR COMMENT (Combined Windows + Android build status with download links)
  # ═══════════════════════════════════════════════════════════════
  pr-comment:
    name: Comment PR Builds
    runs-on: ubuntu-latest
    needs: [build-windows-pr, build-android]
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    permissions:
      pull-requests: write
    steps:
      - name: Post build status comment
        uses: actions/github-script@v9
        with:
          script: |
            const windowsStatus = '${{ needs.build-windows-pr.result }}';
            const androidStatus = '${{ needs.build-android.result }}';

            const windowsEmoji = windowsStatus === 'success' ? '✅' : (windowsStatus === 'failure' ? '❌' : '⏭️');
            const androidEmoji = androidStatus === 'success' ? '✅' : (androidStatus === 'failure' ? '❌' : '⏭️');

            let body = `## 📦 PR Build Status\n\n`;
            body += `| Platform | Status | Download |\n`;
            body += `|----------|--------|----------|\n`;

            if (windowsStatus !== 'skipped') {
              body += `| 🪟 Windows | ${windowsEmoji} | [Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |\n`;
            }

            if (androidStatus !== 'skipped') {
              body += `| 🤖 Android | ${androidEmoji} | [Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |\n`;
            }

            body += `\n> ⚠️ Diese Builds sind für Testzwecke.\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # RELEASE JOBS (Only on main push or workflow_dispatch)
  # ═══════════════════════════════════════════════════════════════
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.calc.outputs.version }}
      should-release: ${{ steps.calc.outputs.should-release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate next version
        id: calc
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            echo "should-release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if there are changes since last tag
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEW="v0.1.0"
            echo "should-release=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git log "$LATEST_TAG..HEAD" --oneline --no-decorate)
            if [ -z "$CHANGES" ]; then
              echo "No changes since $LATEST_TAG"
              echo "should-release=false" >> $GITHUB_OUTPUT
              echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            CURRENT="${LATEST_TAG#v}"
            IFS='.' read -r major minor patch <<< "$CURRENT"
            patch=$((patch + 1))
            NEW="v$major.$minor.$patch"
            echo "should-release=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "Next version: $NEW"

  # ── Linux x64 Release ─────────────────────────────────────────
  build-release-linux-x64:
    name: Release Linux x64
    needs: [determine-version, test]
    runs-on: ubuntu-latest
    if: needs.determine-version.outputs.should-release == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Set version
        run: |
          V="${{ needs.determine-version.outputs.version }}"
          V_PLAIN="${V#v}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('electron/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('electron/package.json',JSON.stringify(p,null,2)+'\n');"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('app/package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Build
        working-directory: ./app
        run: npm ci && npm run build

      - name: Build Electron
        working-directory: ./electron
        run: npm ci && npm run build && npx electron-builder --linux --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: |
            electron/release/*.AppImage
            electron/release/*.deb

  # ── Linux arm64 Release ──────────────────────────────────────
  build-release-linux-arm64:
    name: Release Linux arm64
    needs: [determine-version, test]
    runs-on: ubuntu-24.04-arm
    if: needs.determine-version.outputs.should-release == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Set version
        run: |
          V="${{ needs.determine-version.outputs.version }}"
          V_PLAIN="${V#v}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('electron/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('electron/package.json',JSON.stringify(p,null,2)+'\n');"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('app/package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Build
        working-directory: ./app
        run: npm ci && npm run build

      - name: Build Electron
        working-directory: ./electron
        run: npm ci && npm run build && npx electron-builder --linux AppImage --arm64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-release
          path: electron/release/*arm64.AppImage

  # ── Windows Release ───────────────────────────────────────────
  build-release-windows:
    name: Release Windows
    needs: [determine-version, test]
    runs-on: windows-latest
    if: needs.determine-version.outputs.should-release == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Set version
        shell: pwsh
        run: |
          $V = "${{ needs.determine-version.outputs.version }}"
          $VPlain = $V.TrimStart('v')
          $ep = Get-Content 'electron/package.json' | ConvertFrom-Json
          $ep.version = $VPlain
          $ep | ConvertTo-Json -Depth 100 | Set-Content 'electron/package.json'
          $ap = Get-Content 'app/package.json' | ConvertFrom-Json
          $ap.version = $VPlain
          $ap | ConvertTo-Json -Depth 100 | Set-Content 'app/package.json'

      - name: Build
        working-directory: ./app
        run: npm ci && npm run build

      - name: Build Electron
        working-directory: ./electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci && npm run build && npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: electron/release/*.exe

  # ── Android Release ───────────────────────────────────────────
  build-release-android:
    name: Release Android
    needs: [determine-version, test]
    runs-on: ubuntu-latest
    if: needs.determine-version.outputs.should-release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.daemon=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

      - name: Install Capacitor dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Web App
        working-directory: ./app
        run: npm run build:android || npm run build

      - name: Sync Capacitor
        working-directory: ./app
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: ./app/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: ./app/android
        run: ./gradlew assembleRelease --build-cache --configure-on-demand

      - name: Validate APK
        run: |
          APK_SIZE=$(stat -c%s "app/android/app/build/outputs/apk/release/app-release-unsigned.apk")
          echo "APK Size: $APK_SIZE bytes"
          if [ $APK_SIZE -lt 1000000 ]; then
            echo "❌ APK seems too small!"
            exit 1
          fi

      - name: Rename APK with version
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          cp app/android/app/build/outputs/apk/release/app-release-unsigned.apk \
             "app/android/app/build/outputs/apk/release/SecuChat-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/android/app/build/outputs/apk/release/SecuChat-*.apk

  # ── Create GitHub Release ─────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [determine-version, build-release-linux-x64, build-release-linux-arm64, build-release-windows, build-release-android]
    runs-on: ubuntu-latest
    if: needs.determine-version.outputs.should-release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version & push tag
        run: |
          V="${{ needs.determine-version.outputs.version }}"
          V_PLAIN="${V#v}"
          
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('electron/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('electron/package.json',JSON.stringify(p,null,2)+'\n');"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('app/package.json',JSON.stringify(p,null,2)+'\n');"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add electron/package.json app/package.json
          git commit -m "chore: bump version to $V [skip ci]" || echo "No changes to commit"
          # Stale-Tag-Schutz: Wenn ein vorheriger Run den Tag schon gepusht hatte
          # (z.B. wegen fehlgeschlagener Artifact-Downloads), würde der nachfolgende
          # Release-Action-Call den bestehenden Release still mit leerer Asset-Liste
          # überschreiben. Daher: lokal + remote löschen, dann neu taggen.
          git tag -d "$V" 2>/dev/null || true
          git push origin ":refs/tags/$V" 2>/dev/null || true
          git tag "$V"
          git push
          git push --tags

      - name: Download release artifacts
        # explizite Liste statt pattern: — pattern versteht keine Newlines
        # und filtert nichts, wenn kein valides Glob geliefert wird
        # (verifiziert in actions/download-artifact@v4, Run 32110796444).
        # 4 separate Calls mit name: sind robust, explizit, leicht zu debuggen
        # und mergen alle in release-artifacts/.
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-release
          path: release-artifacts/linux-x64
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-release
          path: release-artifacts/linux-arm64
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/windows
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-artifacts/android
          merge-multiple: true

      - name: List release files
        run: find release-artifacts -type f | sort

      - name: Verify release artifacts exist
        run: |
          FILE_COUNT=$(find release-artifacts -type f 2>/dev/null | wc -l)
          echo "Found $FILE_COUNT release artifact files"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ No release artifacts found in release-artifacts/"
            echo "Build jobs must have failed or produced no uploads."
            exit 1
          fi
          find release-artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.determine-version.outputs.version }}
          files: release-artifacts/**
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: true

  # ═══════════════════════════════════════════════════════════════
  # WIKI SYNC
  # ═══════════════════════════════════════════════════════════════
  sync-wiki:
    name: Sync Wiki
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.wiki == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Clone wiki
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git /tmp/wiki

      - name: Copy wiki files
        run: cp wiki/*.md /tmp/wiki/

      - name: Commit and push
        run: |
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "docs: sync wiki from main (${GITHUB_SHA::7})"
          git push

  # ═══════════════════════════════════════════════════════════════
  # SUMMARY
  # ═══════════════════════════════════════════════════════════════
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, test, security, build-windows-pr, build-android, pr-comment]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platform Changes" >> $GITHUB_STEP_SUMMARY
          echo "- Electron: ${{ needs.detect-changes.outputs.electron }}" >> $GITHUB_STEP_SUMMARY
          echo "- Android: ${{ needs.detect-changes.outputs.android }}" >> $GITHUB_STEP_SUMMARY
          echo "- App Core: ${{ needs.detect-changes.outputs.app-core }}" >> $GITHUB_STEP_SUMMARY
          echo "- Wiki: ${{ needs.detect-changes.outputs.wiki }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test & Lint | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows PR | ${{ needs.build-windows-pr.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Build | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR Comment | ${{ needs.pr-comment.result }} |" >> $GITHUB_STEP_SUMMARY
