name: Unified CI/CD (Electron + Android + Release)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.7)'
        required: false

env:
  I2PD_VERSION: '2.59.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # DETECT CHANGES
  # ═══════════════════════════════════════════════════════════════
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      electron: ${{ steps.filter.outputs.electron }}
      android: ${{ steps.filter.outputs.android }}
      app-core: ${{ steps.filter.outputs.app-core }}
      shared: ${{ steps.filter.outputs.shared }}
      wiki: ${{ steps.filter.outputs.wiki }}
      version-file: ${{ steps.filter.outputs.version-file }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            electron:
              - 'electron/**'
              - '.github/workflows/**'
            android:
              - 'android/**'
              - 'capacitor.config.*'
              - '.github/workflows/**'
            app-core:
              - 'app/src/**'
              - 'app/public/**'
              - 'app/__tests__/**'
              - 'app/*.html'
            shared:
              - 'app/package*.json'
              - 'app/tsconfig.json'
              - 'app/vite.config.ts'
            wiki:
              - 'wiki/**'
            version-file:
              - 'app/package.json'
              - 'electron/package.json'

  # ═══════════════════════════════════════════════════════════════
  # TEST & LINT (Always for PRs and main pushes)
  # ═══════════════════════════════════════════════════════════════
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'pull_request' ||
      needs.detect-changes.outputs.electron == 'true' ||
      needs.detect-changes.outputs.android == 'true' ||
      needs.detect-changes.outputs.app-core == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Lint
        working-directory: ./app
        run: npm run lint

      - name: Type Check
        working-directory: ./app
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./app
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/dist
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════
  # SECURITY CHECKS
  # ═══════════════════════════════════════════════════════════════
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitGuardian Scan
        uses: GitGuardian/ggshield-action@v1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Audit App
        working-directory: ./app
        run: npm audit --audit-level=high || true

      - name: Audit Electron
        working-directory: ./electron
        run: npm audit --audit-level=high || true
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # PR WINDOWS BUILD (Non-draft PRs only)
  # ═══════════════════════════════════════════════════════════════
  build-windows-pr:
    name: Build Windows (PR)
    runs-on: windows-latest
    needs: [detect-changes, test]
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (needs.detect-changes.outputs.electron == 'true' ||
       needs.detect-changes.outputs.app-core == 'true' ||
       needs.detect-changes.outputs.shared == 'true')
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          PR_NUM=${{ github.event.pull_request.number }}
          BETA_NUM=${{ github.run_number }}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pr_num=${PR_NUM}" >> $GITHUB_OUTPUT
          echo "beta_num=${BETA_NUM}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Download i2pd (Windows x64)
        shell: pwsh
        run: |
          $url = "https://github.com/PurpleI2P/i2pd/releases/download/${{ env.I2PD_VERSION }}/i2pd_${{ env.I2PD_VERSION }}_win64_mingw.zip"
          Invoke-WebRequest -Uri $url -OutFile i2pd.zip
          Expand-Archive -Path i2pd.zip -DestinationPath i2pd_extract
          Copy-Item i2pd_extract\i2pd.exe electron\resources\i2pd\win\i2pd.exe

      - name: Update package.json version
        shell: pwsh
        run: |
          $packageJson = Get-Content electron/package.json | ConvertFrom-Json
          $packageJson.version = "${{ steps.version.outputs.version }}"
          $packageJson | ConvertTo-Json -Depth 10 | Set-Content electron/package.json

      - name: Build app
        working-directory: ./app
        run: npm ci && npm run build

      - name: Install electron deps
        working-directory: ./electron
        run: npm ci

      - name: Build Electron (Windows)
        working-directory: ./electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Rename artifact with PR number
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $prNum = "${{ steps.version.outputs.pr_num }}"
          $betaNum = "${{ steps.version.outputs.beta_num }}"
          $files = Get-ChildItem electron/release/*.exe
          foreach ($file in $files) {
            $newName = $file.Name -replace "\.${version}\.", ".PR${prNum}.${version}-beta${betaNum}."
            Rename-Item $file.FullName -NewName $newName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-pr-build
          path: electron/release/*.exe
          retention-days: 7

      - name: Comment PR
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🪟 **Windows Build fertig!**\n\n[⬇️ Hier herunterladen](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n> ⚠️ Dies ist ein PR-Build für Testzwecke.`
            })

  # ═══════════════════════════════════════════════════════════════
  # ANDROID BUILD
  # ═══════════════════════════════════════════════════════════════
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [detect-changes, test]
    if: |
      needs.detect-changes.outputs.android == 'true' ||
      needs.detect-changes.outputs.app-core == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Check if Android directory exists
        id: check-android
        run: |
          if [ -d "android" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Android directory not found, skipping Android build"
          fi

      - uses: actions/setup-node@v4
        if: steps.check-android.outputs.exists == 'true'
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        if: steps.check-android.outputs.exists == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: steps.check-android.outputs.exists == 'true'
        uses: android-actions/setup-android@v4

      - name: Install Capacitor dependencies
        if: steps.check-android.outputs.exists == 'true'
        working-directory: ./android
        run: npm ci

      - name: Build Web App
        if: steps.check-android.outputs.exists == 'true'
        working-directory: ./app
        run: npm ci && npm run build:android || npm run build

      - name: Sync Capacitor
        if: steps.check-android.outputs.exists == 'true'
        working-directory: ./android
        run: npx cap sync android

      - name: Build Debug APK
        if: steps.check-android.outputs.exists == 'true'
        working-directory: ./android/android
        run: ./gradlew assembleDebug

      - name: Validate APK
        if: steps.check-android.outputs.exists == 'true'
        run: |
          APK_SIZE=$(stat -c%s "android/android/app/build/outputs/apk/debug/app-debug.apk")
          echo "APK Size: $APK_SIZE bytes"
          if [ $APK_SIZE -lt 1000000 ]; then
            echo "❌ APK seems too small!"
            exit 1
          fi

      - name: Upload APK
        if: steps.check-android.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # KIMI CODE REVIEW (PRs only)
  # ═══════════════════════════════════════════════════════════════
  kimi-review:
    name: Kimi Code Review
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (needs.detect-changes.outputs.app-core == 'true' ||
       needs.detect-changes.outputs.electron == 'true' ||
       needs.detect-changes.outputs.android == 'true')
    permissions:
      contents: read
      pull-requests: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(ts|tsx|js|jsx|json)$' | head -50 || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Kimi Code Review
        id: review
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          REVIEW_CONTENT=""
          for file in ${{ steps.changed-files.outputs.files }}; do
            if [ -f "$file" ]; then
              REVIEW_CONTENT+="\n=== $file ===\n"
              REVIEW_CONTENT+=$(cat "$file" | head -100)
            fi
          done

          PAYLOAD=$(jq -n \
            --arg content "$REVIEW_CONTENT" \
            --arg pr "${{ github.event.pull_request.number }}" \
            '{model: "kimi-coding/k2p5", messages: [{role: "system", content: "You are a code reviewer. Review the following code changes and provide feedback on: 1) Bugs or issues 2) Security concerns 3) Performance improvements 4) Code style. Be concise and actionable."}, {role: "user", content: $content}]}')

          RESPONSE=$(curl -s -X POST "https://api.openrouter.ai/v1/chat/completions" \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "No review generated"')
          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post review comment
        uses: actions/github-script@v8
        with:
          script: |
            const review = `${{ steps.review.outputs.review }}`;
            const prNumber = context.issue.number;
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Kimi Code Review**\n\n${review}\n\n---\n*Powered by Kimi via Claude Code integration*`
            });

  # ═══════════════════════════════════════════════════════════════
  # RELEASE JOBS (Only on main push or workflow_dispatch)
  # ═══════════════════════════════════════════════════════════════
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.calc.outputs.version }}
      should-release: ${{ steps.calc.outputs.should-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate next version
        id: calc
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            echo "should-release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if there are changes since last tag
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEW="v0.1.0"
            echo "should-release=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git log "$LATEST_TAG..HEAD" --oneline --no-decorate)
            if [ -z "$CHANGES" ]; then
              echo "No changes since $LATEST_TAG"
              echo "should-release=false" >> $GITHUB_OUTPUT
              echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            CURRENT="${LATEST_TAG#v}"
            IFS='.' read -r major minor patch <<< "$CURRENT"
            patch=$((patch + 1))
            NEW="v$major.$minor.$patch"
            echo "should-release=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "Next version: $NEW"

  # ── Linux x64 Release ─────────────────────────────────────────
  build-release-linux-x64:
    name: Release Linux x64
    needs: [determine-version, test]
    runs-on: ubuntu-latest
    if: needs.determine-version.outputs.should-release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Set version
        run: |
          V="${{ needs.determine-version.outputs.version }}"
          V_PLAIN="${V#v}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('electron/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('electron/package.json',JSON.stringify(p,null,2)+'\n');"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('app/package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Download i2pd (Linux x64)
        run: |
          curl -L -o i2pd.deb "https://github.com/PurpleI2P/i2pd/releases/download/${{ env.I2PD_VERSION }}/i2pd_${{ env.I2PD_VERSION }}-1_amd64.deb"
          dpkg-deb -x i2pd.deb /tmp/i2pd_extract
          I2PD_BIN=$(find /tmp/i2pd_extract -name "i2pd" -type f | head -1)
          cp "$I2PD_BIN" electron/resources/i2pd/linux/i2pd
          chmod +x electron/resources/i2pd/linux/i2pd

      - name: Build
        working-directory: ./app
        run: npm ci && npm run build

      - name: Build Electron
        working-directory: ./electron
        run: npm ci && npm run build && npx electron-builder --linux --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: |
            electron/release/*.AppImage
            electron/release/*.deb

  # ── Linux arm64 Release ──────────────────────────────────────
  build-release-linux-arm64:
    name: Release Linux arm64
    needs: [determine-version, test]
    runs-on: ubuntu-24.04-arm
    if: needs.determine-version.outputs.should-release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Set version
        run: |
          V="${{ needs.determine-version.outputs.version }}"
          V_PLAIN="${V#v}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('electron/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('electron/package.json',JSON.stringify(p,null,2)+'\n');"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('app/package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Download i2pd (Linux arm64)
        run: |
          curl -L -o i2pd.deb "https://github.com/PurpleI2P/i2pd/releases/download/${{ env.I2PD_VERSION }}/i2pd_${{ env.I2PD_VERSION }}-1_arm64.deb"
          dpkg-deb -x i2pd.deb /tmp/i2pd_extract
          I2PD_BIN=$(find /tmp/i2pd_extract -name "i2pd" -type f | head -1)
          mkdir -p electron/resources/i2pd/linux
          cp "$I2PD_BIN" electron/resources/i2pd/linux/i2pd
          chmod +x electron/resources/i2pd/linux/i2pd

      - name: Build
        working-directory: ./app
        run: npm ci && npm run build

      - name: Build Electron
        working-directory: ./electron
        run: npm ci && npm run build && npx electron-builder --linux AppImage --arm64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-release
          path: electron/release/*arm64.AppImage

  # ── Windows Release ───────────────────────────────────────────
  build-release-windows:
    name: Release Windows
    needs: [determine-version, test]
    runs-on: windows-latest
    if: needs.determine-version.outputs.should-release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Set version
        shell: pwsh
        run: |
          $V = "${{ needs.determine-version.outputs.version }}"
          $VPlain = $V.TrimStart('v')
          $ep = Get-Content 'electron/package.json' | ConvertFrom-Json
          $ep.version = $VPlain
          $ep | ConvertTo-Json -Depth 100 | Set-Content 'electron/package.json'
          $ap = Get-Content 'app/package.json' | ConvertFrom-Json
          $ap.version = $VPlain
          $ap | ConvertTo-Json -Depth 100 | Set-Content 'app/package.json'

      - name: Download i2pd (Windows)
        shell: pwsh
        run: |
          $url = "https://github.com/PurpleI2P/i2pd/releases/download/${{ env.I2PD_VERSION }}/i2pd_${{ env.I2PD_VERSION }}_win64_mingw.zip"
          Invoke-WebRequest -Uri $url -OutFile i2pd.zip
          Expand-Archive -Path i2pd.zip -DestinationPath i2pd_extract
          Copy-Item i2pd_extract\i2pd.exe electron\resources\i2pd\win\i2pd.exe

      - name: Build
        working-directory: ./app
        run: npm ci && npm run build

      - name: Build Electron
        working-directory: ./electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci && npm run build && npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: electron/release/*.exe

  # ── Create GitHub Release ─────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [determine-version, build-release-linux-x64, build-release-linux-arm64, build-release-windows]
    runs-on: ubuntu-latest
    if: needs.determine-version.outputs.should-release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version & push tag
        run: |
          V="${{ needs.determine-version.outputs.version }}"
          V_PLAIN="${V#v}"
          
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('electron/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('electron/package.json',JSON.stringify(p,null,2)+'\n');"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('app/package.json',JSON.stringify(p,null,2)+'\n');"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add electron/package.json app/package.json
          git commit -m "chore: bump version to $V [skip ci]" || echo "No changes to commit"
          git tag "$V" || echo "Tag already exists"
          git push
          git push --tags

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.version }}
          files: artifacts/*
          draft: false
          generate_release_notes: true

  # ═══════════════════════════════════════════════════════════════
  # WIKI SYNC
  # ═══════════════════════════════════════════════════════════════
  sync-wiki:
    name: Sync Wiki
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.wiki == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Clone wiki
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git /tmp/wiki

      - name: Copy wiki files
        run: cp wiki/*.md /tmp/wiki/

      - name: Commit and push
        run: |
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "docs: sync wiki from main (${GITHUB_SHA::7})"
          git push

  # ═══════════════════════════════════════════════════════════════
  # SUMMARY
  # ═══════════════════════════════════════════════════════════════
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, test, security, kimi-review, build-windows-pr]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platform Changes" >> $GITHUB_STEP_SUMMARY
          echo "- Electron: ${{ needs.detect-changes.outputs.electron }}" >> $GITHUB_STEP_SUMMARY
          echo "- Android: ${{ needs.detect-changes.outputs.android }}" >> $GITHUB_STEP_SUMMARY
          echo "- App Core: ${{ needs.detect-changes.outputs.app-core }}" >> $GITHUB_STEP_SUMMARY
          echo "- Wiki: ${{ needs.detect-changes.outputs.wiki }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test & Lint | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows PR | ${{ needs.build-windows-pr.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kimi Review | ${{ needs.kimi-review.result }} |" >> $GITHUB_STEP_SUMMARY
