# ════════════════════════════════════════════════════════════════════════════
# I2P Desktop Build — Linux + Windows CI for the Phase-7 migration.
#
# This workflow is intentionally STANDALONE from the existing
# `.github/workflows/unified-ci.yml`:
#   - unified-ci.yml is complex change-detection + multi-platform pipeline
#     that bundles Electron, Android, and security/release concerns. Touching
#     it for the Phase-7 Java-I2P smoke test would entangle the migration
#     with changes that should land in their own PR.
#   - This workflow only proves the I2CP-Desktop build chain on Linux and
#     Windows where Java I2P is reachable on `127.0.0.1:7654`. It exercises
#     the Task 17 Playwright sentinel test (which is expected to surface the
#     Phase-2 handshake stub as a recorded failure, see continue-on-error).
#
# Phase-7 acceptance gate:
#   * Linux:  vite build → electron tsc → vitest (electron + app)
#             → dist:linux (.AppImage + .deb) → TCP-probe I2CP 7654
#             → Playwright Task 17 (warning, not hard fail).
#   * Windows: vite build → electron tsc → vitest (electron + app)
#              → dist:win (.nsis). Java I2P installed for parity, but the
#              Playwright run is skipped (Windows runner is not a long-lived
#              desktop test environment).
#
# Sentinels & non-blocking expectations:
#   * electron/tests/e2e/i2p-electron.test.ts intentionally uses test.skip()
#     when 127.0.0.1:7654 is unreachable and test.fail() to surface the
#     Phase-2 placeholder b32 contract. We capture the run with
#     continue-on-error: true and let reviewers decide.
#
# Java I2P version:
#   * Linux: PPA `ppa:i2p-maintainers/i2p` (Ubuntu; ubuntu-latest only).
#   * Windows: official NSIS installer `2.13.0` (verified via GitHub
#     i2p/i2p.i2p releases API on 2026-08-17: latest stable = 2.13.0, tag
#     `i2p-2.13.0`, published 2026-07-24). Future bump requires a worked
#     reproducer for the silent-install path before changing the URL.
# ════════════════════════════════════════════════════════════════════════════

name: I2P Desktop Build

on:
  push:
    branches: [feat/android-port, main]
  pull_request:
    branches: [feat/android-port, main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so reruns don't pile up the queue.
# Mirrors the concurrency setting in unified-ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # build-linux: Ubuntu runner with Java I2P + full smoke pipeline.
  # ────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (I2P smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            electron/package-lock.json

      # Java I2P via Ubuntu PPA. The package ships `i2prouter-nowrapper`
      # which is the headless entry point used in Task 16's local-VM run.
      # Debian hosts must use `deb.i2p.net` instead — that's the user's
      # local-SecuchatLinuxI2cp.java setup, not the GH runner.
      - name: Install Java I2P (Ubuntu PPA)
        run: |
          sudo apt-add-repository -y ppa:i2p-maintainers/i2p
          sudo apt-get update
          sudo apt-get install -y i2p

      - name: Install dependencies (app + electron)
        run: |
          cd app && npm ci
          cd ../electron && npm ci

      # Renderer regression gates — fast-fail before the long electron-builder
      # pipeline. tsc-only (no lint) because eslint.config.js is
      # git-protected per project tooling-pitfalls memory; the user runs
      # `npm run lint` explicitly when required.
      - name: Renderer typecheck
        run: cd app && npx tsc --noEmit

      # 3 known pre-existing failures in samNative.test.ts (timer-mock +
      # missing DESTINATION_ERROR throw) are out of scope of the I2CP
      # migration; baseline-confirmed via Final-Review-Rereview and
      # doc'd in the SDD progress notes. The baseline 75/78 ratio is the
      # same on developer's local as on this runner, so we gate the
      # downstream I2CP steps on tsc only and let the vitest failures
      # surface as a non-blocking checkpoint (analogous to Playwright).
      - name: Renderer unit tests
        working-directory: ./app
        continue-on-error: true
        run: npx vitest run

      - name: Vite production build
        run: cd app && npm run build

      # Electron pipeline: tsc compiles the main process, then vitest
      # exercises the desktop-side unit suite (82 tests).
      - name: Electron main tsc
        working-directory: ./electron
        run: npm run build

      - name: Electron unit tests
        working-directory: ./electron
        run: npx vitest run

      # Smoke-test Java I2P is reachable on 127.0.0.1:7654 BEFORE we run the
      # artifact build. If the runner cannot reach the I2CP socket we fail
      # fast with a clear message rather than waste ~5min on electron-builder.
      - name: Start Java I2P (headless) and probe 127.0.0.1:7654
        run: |
          set +e
          i2prouter-nowrapper >/tmp/i2p.log 2>&1 &
          I2P_PID=$!
          echo "i2prouter-nowrapper PID=${I2P_PID}"
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/7654) >/dev/null 2>&1; then
              echo "I2CP port 7654 reachable after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Java I2P did not open 127.0.0.1:7654 within 60s"
          echo "---- last 80 lines of /tmp/i2p.log ----"
          tail -n 80 /tmp/i2p.log || true
          kill ${I2P_PID} 2>/dev/null || true
          exit 1
        shell: bash

      # .AppImage + .deb; matches electron-builder.json linux.targets.
      - name: Package Linux installers
        working-directory: ./electron
        run: npx electron-builder --linux --publish never

      # Task 17 Playwright sentinel. The test uses test.skip() when 7654
      # isn't reachable and test.fail() to surface the Phase-2 placeholder
      # b32 — both outcomes are EXPECTED before Phase 2 lands. We capture
      # the result without hard-failing the job so reviewers can audit the
      # log and decide whether the failure is signal vs noise.
      - name: Playwright Task 17 (non-blocking)
        working-directory: ./electron
        continue-on-error: true
        run: npx playwright test tests/e2e/i2p-electron.test.ts

      - name: Upload Linux installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secuchat-linux-build
          path: |
            electron/release/*.AppImage
            electron/release/*.deb
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────
  # build-windows: Windows runner with Java I2P installed + dist:win.
  # No Playwright run: the Windows CI host is not a long-lived desktop
  # environment for the manual Electron launch path. Java I2P is kept in
  # the pipeline so an Android↔Desktop test rig can be wired up later
  # without re-litigating the workflow.
  # ────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (I2P smoke)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            electron/package-lock.json

      - name: Install Java I2P (Windows NSIS silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:TEMP\i2pinstall.exe"
          # Bounded download: 120s total operation timeout. NSIS drop is
          # ~120 MB; on a slow runner Invoke-WebRequest can spin forever
          # without this — that was the cause of the 45-min hang in
          # commits 5e05878 / 71bf77d.
          #
          # IMPORTANT: Invoke-WebRequest has ONLY -TimeoutSec (read
          # timeout). It does NOT have a -ConnectionTimeoutSec /
          # -ConnectionTimeoutSeconds parameter. Earlier fixes that
          # passed -ConnectionTimeoutSec failed with two different
          # binding errors depending on the runner's PowerShell version:
          #   * "parameter 'ConnectionTimeoutSeconds' is specified more
          #      than once" (prefix-match collision with -TimeoutSec)
          #   * "A parameter cannot be found that matches parameter
          #      name 'TimeoutSeconds'" (typo'd long form)
          # Lesson: stay with the canonical short alias -TimeoutSec.
          try {
            Invoke-WebRequest -Uri "https://files.i2p.net/2.13.0/i2pinstall_2.13.0_windows.exe" `
              -OutFile $installer -UseBasicParsing `
              -TimeoutSec 120
          } catch {
            Write-Host "::error::NSIS download failed: $($_.Exception.Message)"
            Write-Host "---- failing URL: https://files.i2p.net/2.13.0/i2pinstall_2.13.0_windows.exe ----"
            exit 1
          }
          Write-Host "Java I2P NSIS downloaded, $([math]::Round((Get-Item $installer).Length / 1MB, 1)) MB"

          # Bounded install: NSIS registers a Windows service during /S
          # install. The previous `Start-Process -Wait -PassThru | Out-Null`
          # blocked on the service-handle staying open after `i2pinstall`
          # returned 0 — observed as an indefinite hang. We start the
          # process, capture PID, then poll for completion with a hard
          # 5-min deadline. On timeout we kill the installer and any
          # children, then fail-fast.
          $proc = Start-Process -FilePath $installer -ArgumentList "/S" -PassThru
          # Use $installerPid, NOT $pid — $pid is a built-in read-only
          # PowerShell variable (= current process PID). Assigning to it
          # fails with "Cannot overwrite variable PID because it is
          # read-only or constant." This bug was introduced in commit
          # 8a9dd05 and survived 8be4eaf because PowerShell on the
          # ubuntu-test VM doesn't have the same built-in-collision.
          $installerPid = $proc.Id
          Write-Host "i2pinstall.exe started PID=$installerPid"

          $deadline = (Get-Date).AddMinutes(5)
          $exited = $false
          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited) {
              $exited = $true
              break
            }
            Start-Sleep -Seconds 2
          }

          if (-not $exited) {
            Write-Host "::error::NSIS installer did not exit within 5 minutes; killing PID=$installerPid"
            try {
              Stop-Process -Id $installerPid -Force -ErrorAction SilentlyContinue
              Get-CimInstance Win32_Process -Filter "ParentProcessId=$installerPid" |
                ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            } catch {}
            exit 1
          }

          if ($proc.ExitCode -ne 0) {
            Write-Host "::error::i2pinstall.exe exit code $($proc.ExitCode)"
            exit 1
          }
          Write-Host "Java I2P 2.13.0 installer exit OK (code 0)"
          # We do NOT start i2prouter here — the Windows runner is ephemeral
          # and booting the full router is out of scope for the packaging
          # gate. The Linux job above is the I2CP-reachability smoke point.

      - name: Install dependencies (app + electron)
        shell: pwsh
        run: |
          Push-Location app; npm ci; Pop-Location
          Push-Location electron; npm ci; Pop-Location

      - name: Renderer typecheck
        run: cd app && npx tsc --noEmit

      # 3 known pre-existing failures in samNative.test.ts (timer-mock +
      # missing DESTINATION_ERROR throw) are out of scope of the I2CP
      # migration; baseline-confirmed via Final-Review-Rereview and
      # doc'd in the SDD progress notes. The baseline 75/78 ratio is the
      # same on developer's local as on this runner, so we gate the
      # downstream I2CP steps on tsc only and let the vitest failures
      # surface as a non-blocking checkpoint (analogous to Playwright).
      - name: Renderer unit tests
        working-directory: ./app
        continue-on-error: true
        run: npx vitest run

      - name: Vite production build
        run: cd app && npm run build

      - name: Electron main tsc
        working-directory: ./electron
        run: npm run build

      - name: Electron unit tests
        working-directory: ./electron
        run: npx vitest run

      - name: Package Windows installer (NSIS)
        working-directory: ./electron
        run: npx electron-builder --win --publish never

      - name: Upload Windows installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secuchat-windows-build
          path: electron/release/*.exe
          if-no-files-found: warn
