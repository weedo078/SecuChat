name: Kimi Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  kimi-review:
    env:
      LOG_PREVIEW_LINES: 100
      MAX_DIFF_LINES: 500
      MAX_DIFF_FILES: 50
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get PR diff
        id: pr-diff
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" > pr_diff.txt
          echo "diff_lines=$(wc -l < pr_diff.txt)" >> "$GITHUB_OUTPUT"
          echo "diff_files=$(grep -c '^diff --git' pr_diff.txt || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Check diff size limits
        id: check-limits
        run: |
          DIFF_LINES=${{ steps.pr-diff.outputs.diff_lines }}
          DIFF_FILES=${{ steps.pr-diff.outputs.diff_files }}
          LIMITS_EXCEEDED=false

          if [ "$DIFF_FILES" -gt "$MAX_DIFF_FILES" ]; then
            echo "::warning::Diff file count ($DIFF_FILES) exceeds limit ($MAX_DIFF_FILES). Only first $MAX_DIFF_FILES files will be reviewed."
            LIMITS_EXCEEDED=true
          fi

          if [ "$DIFF_LINES" -gt "$MAX_DIFF_LINES" ]; then
            echo "::warning::Diff line count ($DIFF_LINES) exceeds limit ($MAX_DIFF_LINES). Only first $MAX_DIFF_LINES lines will be reviewed."
            LIMITS_EXCEEDED=true
          fi

          echo "limits_exceeded=$LIMITS_EXCEEDED" >> "$GITHUB_OUTPUT"

      - name: Run Kimi Code Review
        if: steps.pr-diff.outputs.diff_lines != '0'
        env:
          ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
          ANTHROPIC_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          set -euo pipefail

          # Create review prompt
          REVIEW_PROMPT='Review this pull request code changes. Focus on:
          1. Security issues (SQL injection, XSS, secrets)
          2. Type safety and potential runtime errors
          3. Code quality and maintainability
          4. Performance concerns
          5. Architecture and design patterns

          Provide specific, actionable feedback with file names and line numbers where applicable.
          Format your response as markdown suitable for a GitHub PR comment.'

          # Validate diff for prompt injection attempts
          if grep -qiE "(ignore.*previous|system.*prompt|you are now|forget.*instructions|disregard.*above|override.*settings)" pr_diff.txt; then
            echo "Warning: Potential prompt injection patterns detected" >&2
          fi

          # Prepare diff content (escape for JSON)
          # Enforce both line count and file count limits strictly
          DIFF_CONTENT=$(awk '
            /^diff --git/ { file_count++ }
            file_count > '"$MAX_DIFF_FILES"' { exit }
            { lines++ }
            lines > '"$MAX_DIFF_LINES"' { exit }
            { print }
          ' pr_diff.txt | jq -Rs '.')

          # Create request JSON using jq --arg for proper escaping
          jq -n \
            --arg prompt "$REVIEW_PROMPT" \
            --arg diff "$DIFF_CONTENT" \
            '{model: "kimi-for-coding", max_tokens: 4000, messages: [{role: "user", content: ($prompt + "\n\nHere is the code diff:\n\n```diff\n" + $diff + "\n```")}]}' > request.json

          # Create curl config file with API key (avoids exposing key in process list)
          {
            echo 'header "Content-Type: application/json"'
            echo "header \"x-api-key: ${ANTHROPIC_API_KEY}\""
            echo 'header "anthropic-version: 2023-06-01"'
            echo 'request POST'
            echo "url \"${ANTHROPIC_BASE_URL}/v1/messages\""
            echo 'data @request.json'
            echo 'max-time 60'
          } > curl_config.txt

          # Call Kimi API for review using config file
          curl -s --fail-with-body --config curl_config.txt > kimi_response.json

          # Validate response and extract review comment
          if [ ! -s kimi_response.json ]; then
            echo "Error: Empty response from Kimi API" >&2
            exit 1
          fi

          jq -r '.content[0].text // "Kimi review failed: no content"' kimi_response.json > review_comment.md

      - name: Post Kimi Review Comment
        if: steps.pr-diff.outputs.diff_lines != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reviewBody;
            try {
              reviewBody = fs.readFileSync('review_comment.md', 'utf8');
              if (!reviewBody || reviewBody.trim() === '' || reviewBody === 'null') {
                reviewBody = '🤖 Kimi Code Review: No issues found or review unavailable.';
              }
            } catch (e) {
              reviewBody = '🤖 Kimi Code Review: Unable to generate review.';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const COMMENT_MARKER = '<!-- kimi-code-review-v1 -->';
            const existingComment = comments.find(c => c.body.includes(COMMENT_MARKER));

            const fullBody = `${COMMENT_MARKER}\n🤖 **Kimi Code Review**\n\n${reviewBody}\n\n---\n*Reviewed by [Kimi](https://www.kimi.com)*`;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: fullBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody
              });
            }

      - name: Generate Review UUID
        if: steps.pr-diff.outputs.diff_lines != '0'
        id: review-uuid
        run: |
          UUID=$(openssl rand -hex 16)
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"

      - name: Send OpenClaw Email Notification
        if: steps.pr-diff.outputs.diff_lines != '0'
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          REVIEW_UUID: ${{ steps.review-uuid.outputs.uuid }}
        run: |
          set -euo pipefail

          # Read review content
          REVIEW_CONTENT=$(cat review_comment.md)

          # Check if there are actual findings (not just empty/no issues messages)
          if echo "$REVIEW_CONTENT" | grep -qiE "(no issues found|no problems|review unavailable|unable to generate)"; then
            echo "No significant review findings - skipping email notification"
            exit 0
          fi

          # Check if review content is empty or too short
          if [ -z "$REVIEW_CONTENT" ] || [ "${#REVIEW_CONTENT}" -lt 50 ]; then
            echo "Review content too short - skipping email notification"
            exit 0
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.head_ref }}"

          SUBJECT="[${REVIEW_UUID}] PR #${PR_NUMBER} - Kimi Review"

          # Build email body with metadata
          EMAIL_BODY=$(cat <<EOF
          Kimi Code Review completed for PR #${PR_NUMBER}

          Repository: ${REPO_NAME}
          Branch: ${BRANCH_NAME}
          Review UUID: ${REVIEW_UUID}

          ---

          ${REVIEW_CONTENT}
          EOF
          )

          # Send email via AgentMail API
          jq -n \
            --arg to "secuchat-fixes@agentmail.to" \
            --arg subject "$SUBJECT" \
            --arg body "$EMAIL_BODY" \
            --arg repo "$REPO_NAME" \
            --arg pr "$PR_NUMBER" \
            --arg branch "$BRANCH_NAME" \
            --arg uuid "$REVIEW_UUID" \
            '{
              to: $to,
              subject: $subject,
              body: $body,
              headers: {
                "X-GitHub-Repo": $repo,
                "X-PR-Number": $pr,
                "X-Branch": $branch,
                "X-Review-UUID": $uuid
              }
            }' > email_payload.json

          # Create curl config file for AgentMail API (avoids exposing key in process list)
          {
            echo 'header "Content-Type: application/json"'
            echo "header \"Authorization: Bearer ${AGENTMAIL_API_KEY}\""
            echo 'request POST'
            echo 'url "https://api.agentmail.to/v1/inboxes/send"'
            echo 'data @email_payload.json'
          } > agentmail_curl_config.txt

          curl -s --fail-with-body --config agentmail_curl_config.txt

          echo "OpenClaw email notification sent successfully"
