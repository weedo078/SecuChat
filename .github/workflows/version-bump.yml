name: Version Bump

on:
  push:
    branches: [main]

# Prevent concurrent version bumps
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump patch version & tag
    runs-on: ubuntu-latest
    # Skip if this is the version bump commit itself
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Use a PAT so the pushed tag triggers release.yml
          # (GITHUB_TOKEN pushes don't trigger other workflows)
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Get next version from latest tag
        id: new
        run: |
          # Get the latest v* tag by version sort
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing v* tag found, starting at 0.1.0"
            NEW="0.1.0"
          else
            echo "Latest tag: $LATEST_TAG"
            # Strip the 'v' prefix
            CURRENT="${LATEST_TAG#v}"
            IFS='.' read -r major minor patch <<< "$CURRENT"
            patch=$((patch + 1))
            NEW="$major.$minor.$patch"
          fi
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "New version: $NEW"

      - name: Update package.json files
        run: |
          V="${{ steps.new.outputs.version }}"

          # electron/package.json
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('electron/package.json', 'utf8'));
            p.version = '$V';
            fs.writeFileSync('electron/package.json', JSON.stringify(p, null, 2) + '\n');
          "

          # app/package.json
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('app/package.json', 'utf8'));
            p.version = '$V';
            fs.writeFileSync('app/package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Commit, tag & push
        run: |
          V="${{ steps.new.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add electron/package.json app/package.json
          git commit -m "chore: bump version to v$V [skip ci]"
          git tag "v$V"
          git push
          git push --tags

      - name: Trigger release workflow
        run: |
          V="${{ steps.new.outputs.version }}"
          gh workflow run release.yml --ref main --field tag="v$V"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
