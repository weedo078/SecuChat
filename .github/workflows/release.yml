name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.6)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Linux x64 ────────────────────────────────────────────────────────────────
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build app
        working-directory: ./app
        run: npm ci && npm run build

      - name: Install electron deps
        working-directory: ./electron
        run: npm ci

      - name: Build Electron (Linux x64)
        working-directory: ./electron
        run: npm run dist:linux -- --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            electron/release/*.AppImage
            electron/release/*.deb
          retention-days: 7

  # ── Windows x64 ──────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build app
        working-directory: ./app
        run: npm ci && npm run build

      - name: Install electron deps
        working-directory: ./electron
        run: npm ci

      - name: Build Electron (Windows)
        working-directory: ./electron
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: electron/release/*.exe
          retention-days: 7

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-linux-x64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          draft: false
          generate_release_notes: true
