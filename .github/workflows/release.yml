name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.7)'
        required: true

env:
  I2PD_VERSION: '2.59.0'

# A new merge cancels any in-progress release pipeline.
# Tag + GitHub Release are only created after all builds succeed,
# so no orphaned tags are left behind.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # ── Determine next version (no tag created yet) ───────────────────────────
  version:
    name: Determine version
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      version: ${{ steps.calc.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: calc
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            echo "Using manually provided tag: ${{ github.event.inputs.tag }}"
            exit 0
          fi
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEW="v0.1.0"
          else
            echo "Latest tag: $LATEST_TAG"
            CURRENT="${LATEST_TAG#v}"
            IFS='.' read -r major minor patch <<< "$CURRENT"
            patch=$((patch + 1))
            NEW="v$major.$minor.$patch"
          fi
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "Next version: $NEW"

  # ── Linux x64 ────────────────────────────────────────────────────────────
  build-linux-x64:
    name: Build Linux x64
    needs: [version]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set version in package.json files
        run: |
          V="${{ needs.version.outputs.version }}"
          V_PLAIN="${V#v}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('electron/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('electron/package.json',JSON.stringify(p,null,2)+'\n');"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('app/package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Download i2pd (Linux x64)
        run: |
          curl -L -o i2pd.deb \
            "https://github.com/PurpleI2P/i2pd/releases/download/${{ env.I2PD_VERSION }}/i2pd_${{ env.I2PD_VERSION }}-1_amd64.deb"
          dpkg-deb -x i2pd.deb /tmp/i2pd_extract
          I2PD_BIN=$(find /tmp/i2pd_extract -name "i2pd" -type f | head -1)
          echo "Found i2pd at: $I2PD_BIN"
          cp "$I2PD_BIN" electron/resources/i2pd/linux/i2pd
          chmod +x electron/resources/i2pd/linux/i2pd

      - name: Build app
        working-directory: ./app
        run: npm ci && npm run build

      - name: Install electron deps
        working-directory: ./electron
        run: npm ci

      - name: Build Electron (Linux x64)
        working-directory: ./electron
        run: npm run dist:linux -- --x64

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            electron/release/*.AppImage
            electron/release/*.deb
          retention-days: 7

  # ── Linux arm64 ───────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Build Linux arm64
    needs: [version]
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set version in package.json files
        run: |
          V="${{ needs.version.outputs.version }}"
          V_PLAIN="${V#v}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('electron/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('electron/package.json',JSON.stringify(p,null,2)+'\n');"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app/package.json','utf8')); p.version='$V_PLAIN'; fs.writeFileSync('app/package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Download i2pd (Linux arm64)
        run: |
          curl -L -o i2pd.deb \
            "https://github.com/PurpleI2P/i2pd/releases/download/${{ env.I2PD_VERSION }}/i2pd_${{ env.I2PD_VERSION }}-1_arm64.deb"
          dpkg-deb -x i2pd.deb /tmp/i2pd_extract
          I2PD_BIN=$(find /tmp/i2pd_extract -name "i2pd" -type f | head -1)
          echo "Found i2pd at: $I2PD_BIN"
          mkdir -p electron/resources/i2pd/linux
          cp "$I2PD_BIN" electron/resources/i2pd/linux/i2pd
          chmod +x electron/resources/i2pd/linux/i2pd

      - name: Build app
        working-directory: ./app
        run: npm ci && npm run build

      - name: Install electron deps
        working-directory: ./electron
        run: npm ci

      - name: Build TypeScript
        working-directory: ./electron
        run: npm run build

      - name: Build Electron (Linux arm64)
        working-directory: ./electron
        # Note: Only AppImage for arm64, DEB requires fpm which has x86/arm64 issues
        run: npx electron-builder --linux AppImage --arm64 --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: electron/release/*arm64.AppImage
          retention-days: 7

  # ── Windows x64 ──────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows x64
    needs: [version]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set version in package.json files
        shell: pwsh
        run: |
          $V = "${{ needs.version.outputs.version }}"
          $VPlain = $V.TrimStart('v')
          $ep = Get-Content 'electron/package.json' | ConvertFrom-Json
          $ep.version = $VPlain
          $ep | ConvertTo-Json -Depth 100 | Set-Content 'electron/package.json'
          $ap = Get-Content 'app/package.json' | ConvertFrom-Json
          $ap.version = $VPlain
          $ap | ConvertTo-Json -Depth 100 | Set-Content 'app/package.json'

      - name: Download i2pd (Windows x64)
        shell: pwsh
        run: |
          $url = "https://github.com/PurpleI2P/i2pd/releases/download/${{ env.I2PD_VERSION }}/i2pd_${{ env.I2PD_VERSION }}_win64_mingw.zip"
          Invoke-WebRequest -Uri $url -OutFile i2pd.zip
          Expand-Archive -Path i2pd.zip -DestinationPath i2pd_extract
          Copy-Item i2pd_extract\i2pd.exe electron\resources\i2pd\win\i2pd.exe

      - name: Build app
        working-directory: ./app
        run: npm ci && npm run build

      - name: Install electron deps
        working-directory: ./electron
        run: npm ci

      - name: Build Electron (Windows)
        working-directory: ./electron
        run: npm run dist:win

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: electron/release/*.exe
          retention-days: 7

  # ── Tag & GitHub Release (only after all builds succeed) ──────────────────
  release:
    name: Tag & Create GitHub Release
    needs: [version, build-linux-x64, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Bump package.json versions & push tag
        if: github.event_name == 'push'
        run: |
          V="${{ needs.version.outputs.version }}"
          V_PLAIN="${V#v}"

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('electron/package.json', 'utf8'));
            p.version = '$V_PLAIN';
            fs.writeFileSync('electron/package.json', JSON.stringify(p, null, 2) + '\n');
          "
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('app/package.json', 'utf8'));
            p.version = '$V_PLAIN';
            fs.writeFileSync('app/package.json', JSON.stringify(p, null, 2) + '\n');
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add electron/package.json app/package.json
          git commit -m "chore: bump version to $V [skip ci]"
          git tag "$V"
          git push
          git push --tags

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: artifacts/*
          draft: false
          generate_release_notes: true
