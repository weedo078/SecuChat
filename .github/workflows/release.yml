name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.7)'
        required: true

env:
  I2PD_VERSION: '2.59.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Linux x64 ────────────────────────────────────────────────────────────────
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Download i2pd (Linux x64)
        run: |
          curl -L -o i2pd.deb \
            "https://github.com/PurpleI2P/i2pd/releases/download/${{ env.I2PD_VERSION }}/i2pd_${{ env.I2PD_VERSION }}-1_amd64.deb"
          dpkg-deb -x i2pd.deb /tmp/i2pd_extract
          I2PD_BIN=$(find /tmp/i2pd_extract -name "i2pd" -type f | head -1)
          echo "Found i2pd at: $I2PD_BIN"
          cp "$I2PD_BIN" electron/resources/i2pd/linux/i2pd
          chmod +x electron/resources/i2pd/linux/i2pd

      - name: Build app
        working-directory: ./app
        run: npm ci && npm run build

      - name: Install electron deps
        working-directory: ./electron
        run: npm ci

      - name: Build Electron (Linux x64)
        working-directory: ./electron
        run: npm run dist:linux -- --x64

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            electron/release/*.AppImage
            electron/release/*.deb
          retention-days: 7

  # ── Linux arm64 ───────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Download i2pd (Linux arm64)
        run: |
          curl -L -o i2pd.deb \
            "https://github.com/PurpleI2P/i2pd/releases/download/${{ env.I2PD_VERSION }}/i2pd_${{ env.I2PD_VERSION }}-1_arm64.deb"
          dpkg-deb -x i2pd.deb /tmp/i2pd_extract
          I2PD_BIN=$(find /tmp/i2pd_extract -name "i2pd" -type f | head -1)
          echo "Found i2pd at: $I2PD_BIN"
          mkdir -p electron/resources/i2pd/linux
          cp "$I2PD_BIN" electron/resources/i2pd/linux/i2pd
          chmod +x electron/resources/i2pd/linux/i2pd

      - name: Build app
        working-directory: ./app
        run: npm ci && npm run build

      - name: Install electron deps
        working-directory: ./electron
        run: npm ci

      - name: Build TypeScript
        working-directory: ./electron
        run: npm run build

      - name: Build Electron (Linux arm64)
        working-directory: ./electron
        # Note: Only AppImage for arm64, DEB requires fpm which has x86/arm64 issues
        run: npx electron-builder --linux AppImage --arm64 --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: electron/release/*arm64.AppImage
          retention-days: 7

  # ── Windows x64 ──────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Download i2pd (Windows x64)
        shell: pwsh
        run: |
          $url = "https://github.com/PurpleI2P/i2pd/releases/download/${{ env.I2PD_VERSION }}/i2pd_${{ env.I2PD_VERSION }}_win64_mingw.zip"
          Invoke-WebRequest -Uri $url -OutFile i2pd.zip
          Expand-Archive -Path i2pd.zip -DestinationPath i2pd_extract
          Copy-Item i2pd_extract\i2pd.exe electron\resources\i2pd\win\i2pd.exe

      - name: Build app
        working-directory: ./app
        run: npm ci && npm run build

      - name: Install electron deps
        working-directory: ./electron
        run: npm ci

      - name: Build Electron (Windows)
        working-directory: ./electron
        run: npm run dist:win

      - name: Set requireAdministrator on installer
        shell: pwsh
        working-directory: ./electron
        run: |
          $exe = (Get-ChildItem "release\*.exe" | Select-Object -First 1).FullName
          Write-Host "Setting requireAdministrator on: $exe"
          npx --yes rcedit "$exe" --set-requested-execution-level requireAdministrator

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: electron/release/*.exe
          retention-days: 7

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-linux-x64, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          draft: false
          generate_release_notes: true
