name: PR

on:
  pull_request:
    branches: [main]

env:
  I2PD_VERSION: '2.59.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Lint
        working-directory: ./app
        run: npm run lint

      - name: Type Check
        working-directory: ./app
        run: npx tsc --noEmit

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Build
        working-directory: ./app
        run: npm run build

  build-windows-pr:
    name: Build Windows PR
    runs-on: windows-latest
    needs: build-web
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          PR_NUM=${{ github.event.pull_request.number }}
          BETA_NUM=${{ github.run_number }}

          echo "Version: ${VERSION}, PR: ${PR_NUM}, Beta: ${BETA_NUM}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pr_num=${PR_NUM}" >> $GITHUB_OUTPUT
          echo "beta_num=${BETA_NUM}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Download i2pd (Windows x64)
        shell: pwsh
        run: |
          $url = "https://github.com/PurpleI2P/i2pd/releases/download/${{ env.I2PD_VERSION }}/i2pd_${{ env.I2PD_VERSION }}_win64_mingw.zip"
          Invoke-WebRequest -Uri $url -OutFile i2pd.zip
          Expand-Archive -Path i2pd.zip -DestinationPath i2pd_extract
          Copy-Item i2pd_extract\i2pd.exe electron\resources\i2pd\win\i2pd.exe

      - name: Update package.json version
        shell: pwsh
        run: |
          $packageJson = Get-Content electron/package.json | ConvertFrom-Json
          $packageJson.version = "${{ steps.version.outputs.version }}"
          $packageJson | ConvertTo-Json -Depth 10 | Set-Content electron/package.json
          Write-Host "Updated version to: ${{ steps.version.outputs.version }}"

      - name: Build app
        working-directory: ./app
        run: npm ci && npm run build

      - name: Install electron deps
        working-directory: ./electron
        run: npm ci

      - name: Build Electron (Windows)
        working-directory: ./electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Rename artifact with PR number and beta suffix
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $prNum = "${{ steps.version.outputs.pr_num }}"
          $betaNum = "${{ steps.version.outputs.beta_num }}"
          $files = Get-ChildItem electron/release/*.exe
          foreach ($file in $files) {
            # Original: SecuChat.Setup.{version}.exe
            # Target: SecuChat.Setup.PR{num}.{version}-beta{betaNum}.exe
            $newName = $file.Name -replace "\.${version}\.", ".PR${prNum}.${version}-beta${betaNum}."
            Rename-Item $file.FullName -NewName $newName
            Write-Host "Renamed: $($file.Name) -> $newName"
          }

      - name: Set requireAdministrator on installer
        shell: pwsh
        working-directory: ./electron
        run: |
          $exe = (Get-ChildItem "release\*.exe" | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "No installer .exe found in release\"; exit 1 }
          Write-Host "Found installer: $exe"
          $rcedit = "$env:TEMP\rcedit.exe"
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile $rcedit
          & $rcedit "$exe" --set-requested-execution-level requireAdministrator
          Write-Host "requireAdministrator set successfully"

      - uses: actions/upload-artifact@v7
        with:
          name: SecuChat-PR${{ github.event.pull_request.number }}-beta${{ steps.version.outputs.beta_num }}-Windows
          path: electron/release/*.exe
          retention-days: 7

      - name: Comment PR
        uses: actions/github-script@v8
        with:
          script: |
            const prNum = '${{ github.event.pull_request.number }}';
            const version = '${{ steps.version.outputs.version }}';
            const betaNum = '${{ steps.version.outputs.beta_num }}';
            const fileName = `SecuChat.Setup.PR${prNum}.${version}-beta${betaNum}.exe`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🪟 **Windows Build fertig!**

              **Datei:** \`${fileName}\`

              ⬇️ [Hier herunterladen](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

              > ⚠️ Dies ist ein PR-Build für Testzwecke.`
            })
